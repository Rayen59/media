<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MediAssist</title>
<style>
:root{--bg:#fff;--fg:#000;--g1:#f3f3f3;--g2:#d9d9d9;--g3:#767676}
@media(prefers-color-scheme:dark){:root{--bg:#000;--fg:#fff;--g1:#121212;--g2:#2b2b2b;--g3:#9a9a9a}}
*{box-sizing:border-box;margin:0}html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:12.5px/1.5 ui-monospace,"SF Mono",Menlo,Consolas,monospace;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--fg);border-radius:0;padding:7px 9px}
button{cursor:pointer}button:hover:not(:disabled){background:var(--fg);color:var(--bg)}button:disabled{opacity:.4}
.solid{background:var(--fg);color:var(--bg)}.solid:hover:not(:disabled){opacity:.8;background:var(--fg);color:var(--bg)}
.hide{display:none!important}
#auth{height:100%;display:flex;align-items:center;justify-content:center;padding:16px;padding-top:max(16px,env(safe-area-inset-top))}
.box{width:100%;max-width:340px;display:flex;flex-direction:column;gap:10px}
.box h1{font-size:20px;letter-spacing:.2em;font-weight:700}.box p,.mut{color:var(--g3);font-size:11px}
.tabs{display:flex}.tabs button{flex:1;border-bottom:0}.tabs .on{background:var(--fg);color:var(--bg)}
#err{color:var(--fg);border-left:3px solid var(--fg);padding-left:8px;min-height:0}
#app{height:100%;display:flex;flex-direction:column;max-width:900px;margin:0 auto;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
header{display:flex;gap:6px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--fg)}
header b{flex:1;letter-spacing:.2em}header button,header select{padding:4px 7px}
.on2{background:var(--fg)!important;color:var(--bg)!important}
#chips{display:flex;gap:6px;padding:7px 10px;overflow-x:auto;border-bottom:1px solid var(--g2)}
#chips button{flex:none;padding:4px 9px;border-color:var(--g3)}
#msgs{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:10px}
.m{max-width:92%;border:1px solid var(--g2);padding:8px 10px}.m.user{align-self:flex-end;background:var(--fg);color:var(--bg);border-color:var(--fg)}
.m p{margin-bottom:5px}.m ul{padding-left:16px;margin-bottom:5px}.m a{color:inherit}
.act{display:flex;gap:10px;margin-top:6px;font-size:10.5px;opacity:.65}.act span{cursor:pointer;text-decoration:underline}
.pl{border-top:1px solid var(--g2);margin-top:6px;padding-top:6px}.pl div{padding:2px 0}
#thumbs{display:flex;gap:6px;padding:0 10px;flex-wrap:wrap}#thumbs span{border:1px solid var(--g3);padding:2px 6px;font-size:11px;cursor:pointer}
#bar{display:flex;gap:6px;padding:8px 10px;border-top:1px solid var(--fg);align-items:flex-end}
#in{flex:1;resize:none;max-height:110px}
.rec{animation:p 1s infinite}@keyframes p{50%{background:var(--g3)}}
dialog{margin:auto;border:1px solid var(--fg);background:var(--bg);color:var(--fg);padding:14px;width:min(380px,94%)}
dialog::backdrop{background:#0008}dialog label{display:block;margin-top:8px;color:var(--g3);font-size:11px}dialog input,dialog textarea{width:100%}
.row{display:flex;gap:6px;margin-top:12px;justify-content:flex-end}
</style></head><body>

<div id="auth"><div class="box">
 <h1>MEDIASSIST</h1><p>Assistant médical IA · vocal · multilingue</p>
 <div class="tabs"><button id="tL" class="on">Connexion</button><button id="tR">Créer un compte</button></div>
 <div id="f1" style="display:contents">
  <input id="em" type="email" placeholder="email" autocomplete="email">
  <input id="pw" type="password" placeholder="mot de passe (8+ caractères)" autocomplete="current-password">
  <button id="go" class="solid">Continuer</button>
 </div>
 <div id="f2" class="hide" style="flex-direction:column;gap:10px">
  <p>Un code à 6 chiffres a été envoyé à votre email.</p>
  <input id="cd" inputmode="numeric" maxlength="6" placeholder="000000" style="letter-spacing:.4em;text-align:center;font-size:18px">
  <button id="vf" class="solid">Vérifier</button><button id="rs">Renvoyer le code</button>
 </div>
 <div id="err"></div>
</div></div>

<div id="app" class="hide">
 <header>
  <b>MEDIASSIST</b>
  <select id="vl" title="Langue du micro"><option value="">🎙 auto</option><option>fr-FR</option><option>en-US</option><option>ar-SA</option><option>es-ES</option><option>pt-BR</option><option>de-DE</option><option>it-IT</option><option>tr-TR</option><option>zh-CN</option><option>hi-IN</option><option>ru-RU</option><option>ja-JP</option><option>sw-KE</option></select>
  <button id="sp" title="Réponse vocale">🔊</button>
  <button id="wt" title="Montre Bluetooth">⌚</button>
  <button id="st" title="Réglages">⚙</button>
 </header>
 <div id="chips"><button data-n="pharmacy">💊 Pharmacies</button><button data-n="hospital">🏥 Hôpitaux</button><button data-t="J’ai de la fièvre depuis 2 jours, que faire ?">🤒 Symptômes</button><button id="cl">🗑 Vider l’historique</button></div>
 <div id="msgs"></div><div id="thumbs"></div>
 <div id="bar">
  <button id="mic" title="Parler">🎙</button><button id="at" title="Photo / PDF">📎</button><button id="ps" title="Coller">⎘</button>
  <input type="file" id="fl" accept="image/*,application/pdf" multiple class="hide">
  <textarea id="in" rows="1" placeholder="Écrivez ou parlez…"></textarea>
  <button id="sd" class="solid">➤</button>
 </div>
</div>

<dialog id="dg">
 <b>RÉGLAGES</b><p class="mut" id="who"></p>
 <label>Clé API Claude <span id="kst"></span><input id="ak" type="password" placeholder="sk-ant-… (laisser vide = inchangée)" autocomplete="off"></label>
 <label>Âge / sexe<input id="pa"></label><label>Maladies<textarea id="pc" rows="2"></textarea></label>
 <label>Traitements<textarea id="pm" rows="2"></textarea></label><label>Allergies<input id="pl"></label>
 <div class="row"><button id="lo">Déconnexion</button><button id="x">Fermer</button><button id="sv" class="solid">Enregistrer</button></div>
</dialog>

<script>
const $=s=>document.querySelector(s);let mode='login',loc=null,files=[],speak=true,me=null,watch=null,busy=false;
const api=async(m,u,b)=>{const r=await fetch(u,{method:m,headers:{'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined});const j=await r.json().catch(()=>({}));if(!r.ok)throw Object.assign(new Error(j.error||'Erreur'),{data:j,status:r.status});return j};
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const md=t=>{let o=[],l=0;for(let x of esc(t).split('\n')){x=x.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');const m=x.match(/^\s*(?:[-*•]|\d+[.)])\s+(.*)/);if(m){if(!l){o.push('<ul>');l=1}o.push('<li>'+m[1]+'</li>')}else{if(l){o.push('</ul>');l=0}if(x.trim())o.push('<p>'+x.replace(/^#+\s*/,'')+'</p>')}}return o.join('')+(l?'</ul>':'')};
const err=t=>$('#err').textContent=t||'';

/* AUTH */
const setMode=m=>{mode=m;$('#tL').classList.toggle('on',m=='login');$('#tR').classList.toggle('on',m=='register');$('#pw').autocomplete=m=='login'?'current-password':'new-password';err()};
$('#tL').onclick=()=>setMode('login');$('#tR').onclick=()=>setMode('register');
const showVerify=()=>{$('#f1').classList.add('hide');$('#f2').classList.remove('hide');$('#f2').style.display='flex'};
$('#go').onclick=async()=>{err();try{await api('POST','/api/'+mode,{email:$('#em').value,password:$('#pw').value});mode=='login'?boot():showVerify()}catch(e){e.data?.needVerify?(showVerify(),err(e.message)):err(e.message)}};
$('#vf').onclick=async()=>{err();try{await api('POST','/api/verify',{email:$('#em').value,code:$('#cd').value});boot()}catch(e){err(e.message)}};
$('#rs').onclick=async()=>{await api('POST','/api/resend',{email:$('#em').value});err('Code renvoyé.')};

async function boot(){
  try{me=await api('GET','/api/me')}catch{return}
  $('#auth').classList.add('hide');$('#app').classList.remove('hide');
  const h=await api('GET','/api/history');$('#msgs').innerHTML='';h.forEach(m=>addMsg(m.role,m.text,m.id));
  if(!h.length)addMsg('assistant','Bonjour. Parlez ou écrivez dans votre langue. Je réponds à voix haute dans la même langue. Envoyez aussi photos et PDF.');
  if(!me.hasKey)openSettings();
}

/* MESSAGES */
function addMsg(role,text,id,places){
  const d=document.createElement('div');d.className='m '+role;d.dataset.id=id||'';
  d.innerHTML=md(text)+(places?.length?'<div class="pl">'+places.map(p=>`<div>• <a target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${p.lat},${p.lng}">${esc(p.name)}</a> · ${p.dist<1000?p.dist+' m':(p.dist/1000).toFixed(1)+' km'}${p.phone?' · '+esc(p.phone):''}</div>`).join('')+'</div>':'');
  const a=document.createElement('div');a.className='act';
  const cp=document.createElement('span');cp.textContent='copier';cp.onclick=async()=>{try{await navigator.clipboard.writeText(text);cp.textContent='copié ✓'}catch{}};
  const dl=document.createElement('span');dl.textContent='supprimer';dl.onclick=async()=>{if(d.dataset.id)await api('DELETE','/api/history/'+d.dataset.id).catch(()=>{});d.remove()};
  a.append(cp,dl);d.appendChild(a);$('#msgs').appendChild(d);$('#msgs').scrollTop=1e9;return d;
}
$('#cl').onclick=async()=>{if(confirm('Supprimer tout l’historique ?')){await api('DELETE','/api/history');$('#msgs').innerHTML=''}};
$('#ps').onclick=async()=>{try{$('#in').value+=await navigator.clipboard.readText()}catch{err('Collage refusé : utilisez Ctrl+V')}};

/* ENVOI */
async function send(text,fromWatch){
  text=(text??$('#in').value).trim();if((!text&&!files.length)||busy)return;busy=true;$('#sd').disabled=true;
  const f=files;files=[];thumbs();$('#in').value='';
  addMsg('user',text||'(fichiers joints)');const w=addMsg('assistant','…');
  try{const r=await api('POST','/api/chat',{text,files:f,loc});
    w.remove();addMsg('assistant',r.text,r.ids[1],r.places);
    if(speak)say(r.text,r.lang);if(watch)toWatch(r.text);
  }catch(e){w.remove();addMsg('assistant','⚠ '+e.message)}
  busy=false;$('#sd').disabled=false;
}
$('#sd').onclick=()=>send();
$('#in').onkeydown=e=>{if(e.key=='Enter'&&!e.shiftKey&&innerWidth>700){e.preventDefault();send()}};
document.querySelectorAll('#chips [data-t]').forEach(b=>b.onclick=()=>send(b.dataset.t));
document.querySelectorAll('#chips [data-n]').forEach(b=>b.onclick=async()=>{
  const p=await getLoc();if(!p)return addMsg('assistant','Activez la localisation.');
  try{const r=await api('GET',`/api/nearby?lat=${p.lat}&lng=${p.lng}&type=${b.dataset.n}`);
    addMsg('assistant',r.length?'Les plus proches :':'Rien trouvé à moins de 5 km.',null,r);
  }catch(e){addMsg('assistant','⚠ '+e.message)}});
const getLoc=()=>new Promise(r=>loc?r(loc):navigator.geolocation?navigator.geolocation.getCurrentPosition(p=>r(loc={lat:+p.coords.latitude.toFixed(4),lng:+p.coords.longitude.toFixed(4)}),()=>r(null),{timeout:9000}):r(null));
getLoc();

/* FICHIERS */
const b64=f=>new Promise(r=>{const x=new FileReader();x.onload=()=>r(x.result.split(',')[1]);x.readAsDataURL(f)});
const shrink=f=>new Promise(r=>{const i=new Image;i.onload=()=>{const s=Math.min(1,1800/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.85).split(',')[1])};i.onerror=()=>r(null);i.src=URL.createObjectURL(f)});
$('#at').onclick=()=>$('#fl').click();
$('#fl').onchange=async e=>{for(const f of e.target.files){if(f.size>20e6){err('Fichier trop gros');continue}
  const pdf=f.type=='application/pdf',d=pdf?await b64(f):await shrink(f);if(d)files.push({name:f.name,type:pdf?f.type:'image/jpeg',data:d})}e.target.value='';thumbs()};
const thumbs=()=>{$('#thumbs').innerHTML='';files.forEach((f,i)=>{const s=document.createElement('span');s.textContent='✕ '+f.name;s.onclick=()=>{files.splice(i,1);thumbs()};$('#thumbs').appendChild(s)})};
document.addEventListener('paste',e=>{[...e.clipboardData.files].forEach(async f=>{if(f.type.startsWith('image/')){files.push({name:'image',type:'image/jpeg',data:await shrink(f)});thumbs()}})});

/* VOIX */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let rec=null;
$('#mic').onclick=()=>{
  if(!SR)return addMsg('assistant','Reconnaissance vocale non supportée par ce navigateur (utilisez Chrome ou Safari).');
  if(rec){rec.stop();return}
  rec=new SR();rec.lang=$('#vl').value||navigator.language||'fr-FR';rec.interimResults=true;
  rec.onresult=e=>{const t=[...e.results].map(r=>r[0].transcript).join('');$('#in').value=t;if(e.results[e.results.length-1].isFinal)send()};
  rec.onend=()=>{rec=null;$('#mic').classList.remove('rec')};rec.onerror=()=>{};rec.start();$('#mic').classList.add('rec');speechSynthesis.cancel();
};
function say(t,lang){
  if(!window.speechSynthesis)return;speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(t.replace(/[*#_`•]/g,'').slice(0,3000));u.lang=lang;
  const v=speechSynthesis.getVoices();u.voice=v.find(x=>x.lang==lang)||v.find(x=>x.lang.slice(0,2)==lang.slice(0,2))||null;speechSynthesis.speak(u);
}
$('#sp').onclick=()=>{speak=!speak;$('#sp').classList.toggle('on2',speak);if(!speak)speechSynthesis.cancel()};$('#sp').classList.add('on2');

/* MONTRE BLUETOOTH (Nordic UART : 6e400001…) */
const NUS='6e400001-b5a3-f393-e0a9-f5e57e43dc3e',RX='6e400002-b5a3-f393-e0a9-f5e57e43dc3e',TX='6e400003-b5a3-f393-e0a9-f5e57e43dc3e';
$('#wt').onclick=async()=>{
  if(watch){watch.dev.gatt.disconnect();return}
  if(!navigator.bluetooth)return addMsg('assistant','Web Bluetooth indisponible : utilisez Chrome sur Android ou ordinateur.');
  try{
    const dev=await navigator.bluetooth.requestDevice({acceptAllDevices:true,optionalServices:[NUS]});
    const srv=await dev.gatt.connect(),s=await srv.getPrimaryService(NUS),rx=await s.getCharacteristic(RX),tx=await s.getCharacteristic(TX);
    let buf='';const dd=new TextDecoder();
    await tx.startNotifications();tx.addEventListener('characteristicvaluechanged',e=>{buf+=dd.decode(e.target.value);let i;while((i=buf.indexOf('\n'))>=0){const t=buf.slice(0,i).trim();buf=buf.slice(i+1);if(t)send(t,true)}});
    watch={dev,rx};$('#wt').classList.add('on2');
    dev.addEventListener('gattserverdisconnected',()=>{watch=null;$('#wt').classList.remove('on2')});
    addMsg('assistant','⌚ Montre connectée : "'+esc(dev.name||'appareil')+'". Parlez dessus : les recherches se font ici, la réponse revient sur la montre.');
  }catch(e){addMsg('assistant','⌚ Connexion annulée ou service non compatible (la montre doit exposer le service UART BLE).')}
};
async function toWatch(t){const b=new TextEncoder().encode(t.replace(/[*#_`]/g,'').slice(0,600)+'\n');
  try{for(let i=0;i<b.length;i+=20){await watch.rx.writeValueWithoutResponse(b.slice(i,i+20));await new Promise(r=>setTimeout(r,25))}}catch{}}

/* RÉGLAGES */
const dg=$('#dg');
function openSettings(){const p=me.profile||{};$('#who').textContent=me.email;$('#kst').textContent=me.hasKey?'✓ enregistrée':'✗ manquante';$('#ak').value='';$('#pa').value=p.age||'';$('#pc').value=p.cond||'';$('#pm').value=p.meds||'';$('#pl').value=p.all||'';dg.showModal()}
$('#st').onclick=openSettings;$('#x').onclick=()=>dg.close();
$('#sv').onclick=async()=>{try{await api('PUT','/api/settings',{apikey:$('#ak').value,profile:{age:$('#pa').value,cond:$('#pc').value,meds:$('#pm').value,all:$('#pl').value}});me=await api('GET','/api/me');dg.close()}catch(e){alert(e.message)}};
$('#lo').onclick=async()=>{await api('POST','/api/logout');location.reload()};
boot();
</script></body></html>
